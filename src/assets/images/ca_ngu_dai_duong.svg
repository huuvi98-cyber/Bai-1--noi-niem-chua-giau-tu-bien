<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="100%" height="100%">
  <defs>
    <!-- Sky & Harbor Lighting -->
    <linearGradient id="harborSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4d7ee"/>
      <stop offset="40%" stop-color="#d4e6f4"/>
      <stop offset="100%" stop-color="#e9f3f9"/>
    </linearGradient>

    <!-- Harbor Water -->
    <linearGradient id="harborWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8299"/>
      <stop offset="50%" stop-color="#2d6d84"/>
      <stop offset="100%" stop-color="#1f5266"/>
    </linearGradient>

    <!-- Blue Wooden Boat Hue -->
    <linearGradient id="boatBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#02568f"/>
      <stop offset="50%" stop-color="#0270b2"/>
      <stop offset="100%" stop-color="#034875"/>
    </linearGradient>

    <linearGradient id="boatDeckBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0884cc"/>
      <stop offset="100%" stop-color="#025588"/>
    </linearGradient>

    <!-- Giant Yellowfin Tuna Gradients -->
    <linearGradient id="tunaBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2f3d"/>
      <stop offset="45%" stop-color="#2a455a"/>
      <stop offset="70%" stop-color="#738a9c"/>
      <stop offset="100%" stop-color="#c5d3dc"/>
    </linearGradient>

    <linearGradient id="tunaBelly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f93a1"/>
      <stop offset="35%" stop-color="#d7e2e8"/>
      <stop offset="70%" stop-color="#f0f5f8"/>
      <stop offset="100%" stop-color="#e2ecf1"/>
    </linearGradient>

    <linearGradient id="tunaFinGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background Sky & Distant Tam Quan Harbor -->
  <rect width="1600" height="420" fill="url(#harborSky)"/>
  <rect y="420" width="1600" height="640" fill="url(#harborWater)"/>

  <!-- Distant Blue Fishing Vessels in Port -->
  <g opacity="0.65">
    <path d="M-40,360 L240,360 L210,430 L-20,430 Z" fill="#02639e"/>
    <rect x="40" y="310" width="110" height="50" fill="#f8fafc" stroke="#94a3b8"/>
    <path d="M420,350 L680,350 L660,420 L440,420 Z" fill="#025384"/>
    <rect x="500" y="300" width="100" height="50" fill="#fef08a" stroke="#ca8a04"/>
    <line x1="100" y1="200" x2="100" y2="360" stroke="#025384" stroke-width="4"/>
    <line x1="550" y1="180" x2="550" y2="350" stroke="#025384" stroke-width="4"/>
  </g>

  <!-- Left Boat in Foreground -->
  <path d="M-80,380 L520,370 L480,590 L-80,590 Z" fill="url(#boatBlue)"/>
  <!-- Red Waterline Stripe -->
  <path d="M-80,520 L495,505 L485,550 L-80,560 Z" fill="#dc2626"/>
  <!-- White Wheelhouse Cabin on Left Boat -->
  <rect x="20" y="240" width="220" height="135" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="50" y="260" width="40" height="65" fill="#0284c7"/>
  <rect x="110" y="260" width="40" height="65" fill="#0284c7"/>
  <rect x="170" y="260" width="40" height="65" fill="#0284c7"/>
  <!-- Fisherman in green in distance -->
  <circle cx="50" cy="270" r="14" fill="#f59e0b"/>
  <rect x="36" y="284" width="28" height="50" fill="#16a34a"/>

  <!-- Tall Lighting Masts & Rigging (Traditional Squid / Tuna Lights) -->
  <line x1="280" y1="60" x2="280" y2="480" stroke="#0369a1" stroke-width="12"/>
  <line x1="160" y1="180" x2="400" y2="180" stroke="#0284c7" stroke-width="8"/>
  <!-- Light bulbs for night fishing -->
  <g fill="#f8fafc" stroke="#64748b" stroke-width="2">
    <ellipse cx="200" cy="185" rx="10" ry="14"/>
    <ellipse cx="250" cy="185" rx="10" ry="14"/>
    <ellipse cx="310" cy="185" rx="10" ry="14"/>
    <ellipse cx="360" cy="185" rx="10" ry="14"/>
  </g>

  <!-- Right Boat Structure & Wooden Rigging -->
  <path d="M720,240 L1680,240 L1680,580 L760,540 Z" fill="#024a7b"/>
  <!-- White Cabin Upper -->
  <rect x="1220" y="310" width="360" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="1260" y="340" width="60" height="85" fill="#0284c7"/>
  <rect x="1340" y="340" width="60" height="85" fill="#0284c7"/>
  <rect x="1420" y="340" width="60" height="85" fill="#0284c7"/>

  <!-- Wooden Support Beams on Right Boat -->
  <line x1="860" y1="80" x2="860" y2="520" stroke="#0284c7" stroke-width="16"/>
  <line x1="1020" y1="60" x2="1020" y2="480" stroke="#0369a1" stroke-width="14"/>
  <line x1="720" y1="160" x2="1140" y2="160" stroke="#0284c7" stroke-width="10"/>

  <!-- Foreground Main Boat Deck (Blue Curved Hatch & Hull) -->
  <path d="M-50,880 Q600,740 1650,880 L1650,1100 L-50,1100 Z" fill="#024e82"/>
  <!-- Large Blue Dome Hatch Cover -->
  <ellipse cx="1060" cy="800" rx="420" ry="240" fill="url(#boatDeckBlue)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Rivets / Bolts on hatch rim -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="700" cy="820" r="4"/>
    <circle cx="760" cy="850" r="4"/>
    <circle cx="840" cy="880" r="4"/>
    <circle cx="940" cy="900" r="4"/>
    <circle cx="1060" cy="910" r="4"/>
    <circle cx="1180" cy="900" r="4"/>
    <circle cx="1280" cy="880" r="4"/>
    <circle cx="1360" cy="850" r="4"/>
    <circle cx="1420" cy="820" r="4"/>
  </g>

  <!-- Heavy Hoist Chain, Hook & Rope at Top Center -->
  <line x1="680" y1="-20" x2="680" y2="120" stroke="#334155" stroke-width="10"/>
  <!-- Metal Swivel & Hook -->
  <rect x="665" y="90" width="30" height="40" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <path d="M680,130 C680,180 640,190 640,165" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <!-- Tied Rope Loop holding Tuna Tail -->
  <path d="M670,140 Q660,200 680,240 Q710,210 685,150" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
  <path d="M660,190 Q690,195 710,180" fill="none" stroke="#b45309" stroke-width="8"/>

  <!-- ============================================== -->
  <!-- GIANT YELLOWFIN OCEAN TUNA (CÁ NGỪ ĐẠI DƯƠNG)  -->
  <!-- ============================================== -->
  <g id="giantTunaGroup">
    <!-- Shadow beneath fish -->
    <ellipse cx="660" cy="920" rx="80" ry="25" fill="#0f172a" opacity="0.3"/>

    <!-- Tail Fin (Caudal Crescent Fin) -->
    <path d="M675,210 C650,140 635,110 600,90 C635,140 660,200 670,230 C680,200 705,140 740,90 C705,110 690,140 675,210 Z" fill="#1e293b"/>
    <!-- Yellow Finlets on Upper Peduncle -->
    <polygon points="695,250 718,245 700,260" fill="url(#tunaFinGold)"/>
    <polygon points="698,270 724,264 703,280" fill="url(#tunaFinGold)"/>
    <polygon points="702,290 730,284 707,302" fill="url(#tunaFinGold)"/>
    <polygon points="705,312 735,306 710,324" fill="url(#tunaFinGold)"/>
    <polygon points="708,335 738,328 713,348" fill="url(#tunaFinGold)"/>
    <polygon points="710,360 740,352 715,372" fill="url(#tunaFinGold)"/>
    <polygon points="712,385 742,378 717,398" fill="url(#tunaFinGold)"/>

    <!-- Main Torpedo Body of Giant Tuna -->
    <!-- Left Contour / Belly and Right Contour / Back -->
    <path d="M670,225
             C650,280 610,360 580,480
             C540,640 550,780 580,850
             C595,885 620,915 640,925
             C655,910 680,850 710,750
             C745,630 755,480 730,360
             C715,290 690,240 670,225 Z"
          fill="url(#tunaBelly)" stroke="#475569" stroke-width="2"/>

    <!-- Dark Steely Blue / Iridescent Back Shading -->
    <path d="M670,225
             C690,240 715,290 730,360
             C755,480 745,630 710,750
             C680,850 655,910 640,925
             C645,840 650,710 640,580
             C635,460 645,340 670,225 Z"
          fill="url(#tunaBack)" opacity="0.88"/>

    <!-- Tuna Head / Operculum / Gill Lines -->
    <path d="M625,780 C600,810 590,850 620,890" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M605,820 C585,845 590,875 608,895" fill="none" stroke="#475569" stroke-width="2.5"/>

    <!-- Tuna Eye (Reflective deep dark with gold ring) -->
    <circle cx="615" cy="860" r="14" fill="#0f172a" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="612" cy="857" r="4" fill="#ffffff" opacity="0.8"/>

    <!-- Pectoral Fin (Folded along side) -->
    <path d="M580,600 C560,660 550,720 575,760 C570,720 575,660 590,610 Z" fill="#334155" opacity="0.9"/>
  </g>

  <!-- ============================================== -->
  <!-- FISHERMEN CREW AT HARBOR                       -->
  <!-- ============================================== -->

  <!-- 1. Fisherman on Left (Holding Tuna Body in Blue Shirt & Cap) -->
  <g id="fishermanLeft">
    <!-- Torso in Blue Dri-Fit / Work Jersey -->
    <path d="M280,480 L440,430 L450,750 L270,750 Z" fill="#0284c7"/>
    <!-- Red stripes on sleeves -->
    <line x1="280" y1="530" x2="310" y2="750" stroke="#dc2626" stroke-width="6"/>
    <!-- Dark Work Pants -->
    <path d="M270,750 L450,750 L420,1020 L260,1020 Z" fill="#1e293b"/>
    <!-- Arm reaching to steady the giant tuna -->
    <path d="M420,450 Q520,380 620,440" fill="none" stroke="#0284c7" stroke-width="46" stroke-linecap="round"/>
    <!-- Glove / Hand holding Tuna -->
    <ellipse cx="630" cy="445" rx="22" ry="18" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <!-- Head & Cap -->
    <circle cx="395" cy="380" r="32" fill="#ca8a04"/>
    <path d="M350,370 Q395,330 440,360 L455,370 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Green protective face mask -->
    <path d="M375,375 Q420,375 425,410 Q385,415 375,375 Z" fill="#22c55e"/>
  </g>

  <!-- 2. Central Fisherman in Brown Shirt (Smiling & Flashing Peace Sign) -->
  <g id="fishermanHeroCenter">
    <!-- Right leg bent on boat hatch, left leg standing -->
    <path d="M780,680 L960,650 L990,950 L770,950 Z" fill="#1e293b"/>
    <!-- Bare feet / sandals on hatch -->
    <ellipse cx="940" cy="960" rx="35" ry="16" fill="#d97706"/>

    <!-- Brown T-Shirt / Work Top -->
    <path d="M830,370 C880,350 940,360 970,390 L950,670 L800,670 Z" fill="#785340"/>
    
    <!-- Left Arm extending forward flashing Peace / Victory V-Sign with black glove -->
    <path d="M830,420 Q750,470 710,510" fill="none" stroke="#785340" stroke-width="36" stroke-linecap="round"/>
    <!-- Forearm & Black Work Glove -->
    <ellipse cx="700" cy="520" rx="20" ry="18" fill="#1e293b"/>
    <!-- Peace V fingers -->
    <line x1="695" y1="515" x2="680" y2="480" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <line x1="705" y1="515" x2="705" y2="475" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>

    <!-- Head & Cheerful Smile -->
    <circle cx="910" cy="310" r="36" fill="#b45309"/>
    <!-- Black Short Crop Hair -->
    <path d="M875,305 C880,260 945,260 950,305 Z" fill="#0f172a"/>
    <!-- Broad Happy White Smile -->
    <path d="M885,320 Q910,345 935,320 Z" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- 3. Fisherman in Foreground Right (Grey Jacket, Cap & Mask) -->
  <g id="fishermanRight">
    <!-- Grey Work Jacket with Badge -->
    <path d="M1120,720 C1180,680 1340,690 1420,740 L1440,1050 L1080,1050 Z" fill="#64748b"/>
    <!-- Security / Fishery Badge on sleeve -->
    <circle cx="1370" cy="840" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Dark Baseball Cap & Face Mask -->
    <ellipse cx="1230" cy="650" rx="42" ry="32" fill="#1e293b"/>
    <path d="M1180,660 Q1240,630 1290,660" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    <path d="M1200,670 Q1245,670 1255,715 Q1205,715 1200,670 Z" fill="#f8fafc"/>
  </g>

  <!-- Documentary Editorial Overlay Text Badge in top right corner -->
  <g transform="translate(1180, 40)" opacity="0.95">
    <rect x="0" y="0" width="380" height="70" rx="10" fill="#021b36" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="1">CẢNG CÁ TAM QUAN · BẮT ĐƯỢC CÁ LỚN</text>
    <text x="20" y="52" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Cá ngừ đại dương xuất bến sau chuyến biển</text>
  </g>
</svg>
