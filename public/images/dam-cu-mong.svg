<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="lagoonSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lagoonWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="blueDrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="woodBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="580" fill="url(#lagoonSky)"/>
  <rect y="580" width="1920" height="500" fill="url(#lagoonWater)"/>

  <!-- Distant mangrove shoreline and power pylons -->
  <path d="M0,560 Q960,540 1920,560 L1920,590 L0,590 Z" fill="#047857" opacity="0.6"/>
  <!-- Power line pylon in distance -->
  <line x1="260" y1="420" x2="260" y2="560" stroke="#64748b" stroke-width="4"/>
  <line x1="230" y1="450" x2="290" y2="450" stroke="#64748b" stroke-width="4"/>

  <!-- Blue 200L Barrels floating under frame -->
  <g transform="translate(1000, 480)">
    <rect x="0" y="0" width="280" height="170" rx="30" fill="url(#blueDrum)"/>
    <ellipse cx="20" cy="85" rx="15" ry="70" fill="#1e3a8a"/>
    <line x1="140" y1="0" x2="140" y2="170" stroke="#f97316" stroke-width="6"/>
  </g>
  <g transform="translate(1540, 680)">
    <rect x="0" y="0" width="340" height="200" rx="36" fill="url(#blueDrum)"/>
  </g>

  <!-- Heavy Wooden Cage Framework in Foreground -->
  <!-- Horizontal Main Timber Beam across screen -->
  <rect x="0" y="620" width="1920" height="70" fill="url(#woodBeam)" stroke="#78350f" stroke-width="6"/>
  <!-- Connecting Longitudinal Beams -->
  <polygon points="120,690 320,1080 440,1080 240,690" fill="url(#woodBeam)"/>
  <polygon points="560,690 680,1080 800,1080 680,690" fill="url(#woodBeam)"/>

  <!-- Massive Heavy Iron C-Clamp (Cảo chữ C bằng thép) -->
  <path d="M840,480 L960,480 L960,540 L900,540 L900,780 L960,780 L960,840 L840,840 Z" fill="#334155" stroke="#0f172a" stroke-width="8"/>
  <!-- Clamp screw shaft -->
  <rect x="940" y="460" width="24" height="420" fill="#64748b"/>
  <circle cx="952" cy="450" r="18" fill="#0f172a"/>

  <!-- Fisherman 1: Standing on left checking timber -->
  <g transform="translate(380, 70)">
    <!-- Cap -->
    <ellipse cx="160" cy="65" rx="45" ry="18" fill="#d97706"/>
    <!-- Head -->
    <ellipse cx="140" cy="80" rx="35" ry="45" fill="#b45309"/>
    <!-- Black Long Sleeve Shirt -->
    <rect x="70" y="125" width="140" height="280" rx="20" fill="#0f172a"/>
    <!-- Gray Shorts -->
    <rect x="90" y="405" width="100" height="150" fill="#64748b"/>
  </g>

  <!-- Fisherman 2: Crouching by the C-Clamp -->
  <g transform="translate(540, 320)">
    <!-- Cap & Head -->
    <ellipse cx="180" cy="90" rx="55" ry="24" fill="#334155"/>
    <ellipse cx="160" cy="110" rx="35" ry="40" fill="#b45309"/>
    <!-- Navy Blue Jacket -->
    <path d="M120,150 Q220,130 260,260 L240,390 L100,380 Z" fill="#1e3a8a"/>
    <!-- Arm tightening the clamp handle -->
    <path d="M220,200 L340,180 L350,220 L240,240 Z" fill="#1e3a8a"/>
    <ellipse cx="360" cy="200" rx="22" ry="16" fill="#b45309"/>
  </g>
</svg>