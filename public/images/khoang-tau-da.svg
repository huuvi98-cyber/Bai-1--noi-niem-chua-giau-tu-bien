<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="deckSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="woodPlank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#deckSky)"/>

  <!-- Blue ship superstructure in background -->
  <rect x="420" y="240" width="880" height="340" fill="#0284c7" rx="16"/>
  <!-- Cabin Windows with red trim -->
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="12">
    <rect x="470" y="290" width="110" height="180" rx="8"/>
    <rect x="610" y="290" width="110" height="180" rx="8"/>
    <rect x="750" y="290" width="110" height="180" rx="8"/>
    <rect x="890" y="290" width="110" height="180" rx="8"/>
    <rect x="1030" y="290" width="110" height="180" rx="8"/>
    <rect x="1170" y="290" width="110" height="180" rx="8"/>
  </g>
  <!-- Registration number stamped on cabin: 0399045 -->
  <text x="860" y="220" font-family="sans-serif" font-weight="900" font-size="54" fill="#dc2626" text-anchor="middle" letter-spacing="6">
    ★ 0399045 ★
  </text>

  <!-- Open Wooden Ice Hold Hatch on Right (Hầm đá) -->
  <polygon points="1320,380 1860,260 1780,1080 1260,1080" fill="url(#woodPlank)" stroke="#78350f" stroke-width="8"/>
  <!-- Wooden battens on hatch -->
  <line x1="1450" y1="360" x2="1400" y2="1080" stroke="#78350f" stroke-width="16"/>
  <line x1="1600" y1="330" x2="1540" y2="1080" stroke="#78350f" stroke-width="16"/>
  <line x1="1740" y1="290" x2="1680" y2="1080" stroke="#78350f" stroke-width="16"/>

  <!-- Left Deck Machinery (Winch / Drum) -->
  <path d="M0,640 Q220,540 380,720 L320,1080 L0,1080 Z" fill="#0369a1" stroke="#0284c7" stroke-width="8"/>
  <circle cx="240" cy="780" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="10"/>

  <!-- Fisherman in Dark Green Shirt folding White Canvas -->
  <!-- Head -->
  <ellipse cx="980" cy="220" rx="60" ry="75" fill="#d97706"/>
  <!-- Hair -->
  <path d="M920,200 Q980,130 1040,190 Q1020,150 960,150 Q920,160 920,200 Z" fill="#0f172a"/>
  <!-- Gold chain necklace -->
  <path d="M950,285 Q980,315 1010,285" fill="none" stroke="#facc15" stroke-width="6"/>

  <!-- Torso in green crew shirt -->
  <path d="M900,290 Q980,280 1060,290 L1080,560 L880,560 Z" fill="#065f46"/>

  <!-- Arms reaching down holding the white tarpaulin sheet -->
  <path d="M900,320 L760,490 L820,520 L940,380 Z" fill="#b45309"/>
  <path d="M1060,320 L1200,470 L1150,510 L1020,380 Z" fill="#b45309"/>

  <!-- Giant White Insulated Canvas Sheet (Bạt cách nhiệt hầm cá) -->
  <polygon points="780,480 1220,460 1340,1080 660,1080" fill="#f8fafc" stroke="#cbd5e1" stroke-width="6"/>
  <!-- Canvas folds -->
  <path d="M780,480 Q980,540 1220,460 L1260,780 Q1020,840 720,790 Z" fill="#f1f5f9"/>
</svg>